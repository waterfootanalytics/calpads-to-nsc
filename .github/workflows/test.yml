name: Test the graduates file workflow

on:
  push:
  pull_request:
  schedule:
    - cron: '17 12 * * 1'

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poppler for Windows PDF tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --version=26.9.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reader = Get-ChildItem "$env:ChocolateyInstall/lib/poppler" -Filter pdftotext.exe -File -Recurse | Select-Object -First 1
          if (!$reader) { throw "The Poppler installation is missing pdftotext.exe." }
          $reader.DirectoryName >> $env:GITHUB_PATH
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: prepare-nsc-graduates --version
      - run: prepare-nsc-graduates --help
      - run: python -m unittest discover -s tests -v
